<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7F8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF3E7"/>
    </linearGradient>
  </defs>

  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="80" fill="#FBD5E5" opacity="0.3"/>
  <circle cx="1100" cy="530" r="100" fill="#F9E4D4" opacity="0.3"/>
  <circle cx="200" cy="500" r="60" fill="#FBD5E5" opacity="0.2"/>
  <circle cx="1000" cy="150" r="70" fill="#F9E4D4" opacity="0.2"/>

  <!-- Main Content -->
  <text x="600" y="220" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#111827" text-anchor="middle">
    Events by <tspan fill="#FB7185">Maryann</tspan>
  </text>

  <text x="600" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" fill="#4B5563" text-anchor="middle">
    Luxury Event Decor
  </text>

  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#6B7280" text-anchor="middle">
    Weddings • Showers • Special Events
  </text>

  <!-- Location Badge -->
  <rect x="450" y="410" width="300" height="60" rx="30" fill="#111827"/>
  <text x="600" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
    Long Island, NY
  </text>

  <!-- Decorative Flower Icons -->
  <circle cx="350" cy="280" r="4" fill="#FB7185"/>
  <circle cx="850" cy="280" r="4" fill="#FB7185"/>
  <circle cx="370" cy="295" r="3" fill="#FBBF24"/>
  <circle cx="830" cy="295" r="3" fill="#FBBF24"/>
</svg>
